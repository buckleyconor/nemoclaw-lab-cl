# Scenario: GPU Xid 79 — GPU has fallen off the bus
id: scn-gpu-xid-79
pack_id: datacenter-xe9680
target_asset: gpu-server-02
fault_type: gpu_xid

emit:
  event:
    severity: Critical
    message_id: "OEM.1.0.GPUFault"
  log_entries:
    - severity: Critical
      message: "GPU0: Xid 79: GPU has fallen off the bus"
    - severity: Critical
      message: "NVRM: Xid (PCI:0000:3b:00): 79, pid='<unknown>', name=<unknown>"

log_bundle_ref: bundles/scn-gpu-xid-79.log

# Canonical error signatures used for deterministic KB fallback.
error_signatures:
  - "Xid 79"
  - "GPU has fallen off the bus"

kb_article_ref: kb/KB000123.md

remediation_steps:
  - id: drain_node
    label: "Cordon and drain affected node"
  - id: gpu_reset
    label: "Issue GPU reset via iDRAC"
  - id: verify_health
    label: "Re-run DCGM health check"
impact:
  summary: "Node will be cordoned and drained, the failed GPU reset via driver reload, and health re-verified before returning to the scheduler pool."
  workload_impact: "All training/inference workloads on this node are checkpointed and migrated to spare capacity before the GPU reset — expect job rescheduling delays."
  service_risk: "Cluster capacity reduced by one 8-GPU node for the duration; no impact to other nodes. Distributed jobs spanning this node will restart from checkpoint."
  estimated_duration: "~15-20 minutes"
