# Scenario: PSU redundancy loss — power supply 2 input failure
id: scn-psu-loss
pack_id: datacenter-xe9680
target_asset: gpu-server-01
fault_type: psu_failure

emit:
  event:
    severity: Critical
    message_id: "OEM.1.0.PSULost"
  log_entries:
    - severity: Critical
      message: "PSU 2 input power lost — redundancy degraded"
    - severity: Warning
      message: "System operating on single PSU; workload at risk"

log_bundle_ref: bundles/scn-psu-loss.log

error_signatures:
  - "PSU 2 input lost"
  - "power supply failure"

kb_article_ref: kb/KB000789.md

remediation_steps:
  - id: acknowledge_alert
    label: "Acknowledge PSU fault in iDRAC"
  - id: schedule_maintenance
    label: "Schedule PSU replacement with facilities"
  - id: verify_redundancy
    label: "Confirm remaining PSU load within limits"
impact:
  summary: "Alert acknowledged and physical PSU replacement scheduled; redundancy re-verified after the maintenance window."
  workload_impact: "None immediately — the node keeps running on the redundant supplies. No drain or migration is required for this action."
  service_risk: "Degraded power redundancy until the PSU is replaced; a second PSU failure in the same group could force an unplanned shutdown."
  estimated_duration: "~5 minutes now + scheduled maintenance window"
