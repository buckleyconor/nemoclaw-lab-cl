# Scenario: MRI cryocooler coldhead stopped — helium pressure rising, quench risk over days
id: scn-mri-coldhead-failure
pack_id: healthcare-devices
target_asset: mri-01
fault_type: coldhead_failure

emit:
  event:
    severity: Critical
    message_id: "MRI.1.0.COLDHEAD"
  log_entries:
    - severity: Warning
      message: "Compressor cycling irregular — coldhead second-stage temperature trending above nominal"
    - severity: Critical
      message: "Coldhead failure — compressor stopped, helium pressure rising, cryocooler service required"

log_bundle_ref: bundles/scn-mri-coldhead-failure.log

error_signatures:
  - "Coldhead failure"
  - "helium pressure rising"
  - "cryocooler service required"

kb_article_ref: kb/KB700003.md

remediation_steps:
  - id: restart_compressor
    label: "Attempt compressor restart per the scanner manufacturer's cryogenics restart procedure"
  - id: verify_coldhead_cycling
    label: "Verify coldhead second-stage temperature returns to nominal cycling range"
  - id: open_vendor_service_case
    label: "Open a manufacturer service case for cryocooler diagnosis if restart does not hold"
  - id: monitor_helium_trend
    label: "Monitor helium level and pressure trend continuously until service resolves the fault"
impact:
  summary: "Compressor restart is attempted immediately since a stopped coldhead allows helium boil-off and pressure rise; if restart doesn't hold, the scanner is taken out of clinical use and the scanner manufacturer is engaged before helium loss progresses toward a quench."
  workload_impact: "If the compressor does not restart successfully, the scanner must be taken out of clinical service — all scheduled MRI exams on this unit need to be rescheduled or diverted until resolved."
  service_risk: "High — sustained coldhead failure allows liquid helium boil-off to continue, and if pressure relief is exceeded without intervention, the magnet can quench: an abrupt loss of superconductivity that vents helium and takes the scanner offline for days to weeks for a helium refill and magnet ramp."
  estimated_duration: "~15 minutes to attempt restart and assess; if unsuccessful, vendor service engagement and helium refill (if needed) can take days."
