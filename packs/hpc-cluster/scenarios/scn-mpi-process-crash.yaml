id: scn-mpi-process-crash
pack_id: hpc-cluster
target_asset: hpc-node-01
fault_type: mpi_crash
status: scaffold

emit:
  event:
    severity: Warning
    message_id: "HPC.1.0.MPICrash"
  log_entries:
    - severity: Warning
      message: "MPI process rank 0 terminated abnormally — scaffold placeholder"

log_bundle_ref: bundles/scn-mpi-process-crash.log

