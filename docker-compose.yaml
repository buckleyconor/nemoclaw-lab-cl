# Local development stack — builds images from source.
# Usage:
#   docker compose up --build
#
# The agent is NOT a Compose service (ADR-011): the real NemoClaw/OpenClaw
# stack runs as a peer host process. After the stack is up, onboard it with:
#   deploy/scripts/onboard-openclaw.sh
# The agent's LLM endpoint is configured during onboarding, not here.

x-backend-build: &backend-build
  context: .
  dockerfile: docker/Dockerfile.backend

x-env-common: &env-common
  PACK_ID: ${PACK_ID:-datacenter-xe9680}

# Host-disk hygiene: cap per-container json logs (daemon has no default rotation).
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:

  # ── Simulator ────────────────────────────────────────────────────────────────
  simulator:
    restart: unless-stopped
    build: *backend-build
    command: >
      python -m uvicorn services.simulator.main:app
      --host 0.0.0.0 --port 8003
    environment:
      <<: *env-common
    ports:
      - "8003:8003"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8003/healthz')"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *logging

  # ── Orchestrator ─────────────────────────────────────────────────────────────
  orchestrator:
    restart: unless-stopped
    build: *backend-build
    command: >
      python -m uvicorn services.orchestrator.main:app
      --host 0.0.0.0 --port 8002
    environment:
      <<: *env-common
      SIMULATOR_URL: http://simulator:8003
    ports:
      - "8002:8002"
    depends_on:
      simulator:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8002/healthz')"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *logging

  # ── MCP Tools ────────────────────────────────────────────────────────────────
  mcp-tools:
    restart: unless-stopped
    build: *backend-build
    command: >
      python -m uvicorn services.mcp_tools.main:app
      --host 0.0.0.0 --port 8004
    environment:
      <<: *env-common
      SIMULATOR_URL: http://simulator:8003
      ORCHESTRATOR_URL: http://orchestrator:8002
      GATEWAY_URL: http://gateway:8001
    ports:
      - "8004:8004"
    depends_on:
      simulator:
        condition: service_healthy
      orchestrator:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8004/healthz')"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *logging

  # ── Gateway (API + React SPA) ─────────────────────────────────────────────────
  gateway:
    restart: unless-stopped
    build:
      context: .
      dockerfile: docker/Dockerfile.gateway
    environment:
      <<: *env-common
      ORCHESTRATOR_URL: http://orchestrator:8002
      MCP_TOOLS_URL: http://mcp-tools:8004
      # OpenClaw webhook wake-up (ADR-011). The OpenClaw gateway runs on the
      # host: http://host.docker.internal:<webhook port> — default 18789, but
      # openclaw self-reassigns if taken (18790 on the reference host); confirm
      # with `nemoclaw <sandbox> status`, and run `make hook-relay` on Linux
      # (openshell's forward binds loopback, unreachable from this container).
      OPENCLAW_HOOK_URL: ${OPENCLAW_HOOK_URL:-}
      OPENCLAW_HOOK_TOKEN: ${OPENCLAW_HOOK_TOKEN:-}
      # Lab-health chip (UI): probe the agent's LLM route through the host
      # inference proxy (ADR-014) with the shared key. LLM_PROXY_PORT is
      # commented out in .env by default, so the 18100 default applies.
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_PROXY_PORT: ${LLM_PROXY_PORT:-18100}
      # Embedded operator terminal (ADR-012). The terminal daemon runs on the
      # host (`make terminal`); from this container it is
      # ws://host.docker.internal:8005/ws. Off unless URL + token are set.
      TERMINAL_WS_URL: ${TERMINAL_WS_URL:-}
      TERMINAL_TOKEN: ${TERMINAL_TOKEN:-}
      TERMINAL_ENABLED: ${TERMINAL_ENABLED:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8001:8001"
    depends_on:
      orchestrator:
        condition: service_healthy
      mcp-tools:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/healthz')"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *logging

  # The agent runtime is real NemoClaw/OpenClaw, onboarded as a host process
  # via deploy/scripts/onboard-openclaw.sh (ADR-011). It reaches mcp-tools and
  # gateway through the ports published above.

# Pinned subnet so the ufw rules bootstrap.sh prints are deterministic across
# hosts and network re-creations (it sits inside 172.16.0.0/12, which every
# existing allowed_ips/ufw suggestion already covers). If this range collides
# with something on your host, change it here — bootstrap detects the live
# subnet either way.
networks:
  default:
    ipam:
      config:
        - subnet: 172.28.100.0/24
