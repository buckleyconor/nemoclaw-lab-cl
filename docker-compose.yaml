# Local development stack — builds images from source.
# Usage:
#   docker compose up --build
#
# The agent is NOT a Compose service (ADR-011): the real NemoClaw/OpenClaw
# stack runs as a peer host process. After the stack is up, onboard it with:
#   deploy/scripts/onboard-openclaw.sh
# The agent's LLM endpoint is configured during onboarding, not here.

x-backend-build: &backend-build
  context: .
  dockerfile: docker/Dockerfile.backend

x-env-common: &env-common
  PACK_ID: ${PACK_ID:-datacenter-xe9680}

services:

  # ── Simulator ────────────────────────────────────────────────────────────────
  simulator:
    build: *backend-build
    command: >
      python -m uvicorn services.simulator.main:app
      --host 0.0.0.0 --port 8003
    environment:
      <<: *env-common
    ports:
      - "8003:8003"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8003/healthz')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Orchestrator ─────────────────────────────────────────────────────────────
  orchestrator:
    build: *backend-build
    command: >
      python -m uvicorn services.orchestrator.main:app
      --host 0.0.0.0 --port 8002
    environment:
      <<: *env-common
      SIMULATOR_URL: http://simulator:8003
    ports:
      - "8002:8002"
    depends_on:
      simulator:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8002/healthz')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── MCP Tools ────────────────────────────────────────────────────────────────
  mcp-tools:
    build: *backend-build
    command: >
      python -m uvicorn services.mcp_tools.main:app
      --host 0.0.0.0 --port 8004
    environment:
      <<: *env-common
      SIMULATOR_URL: http://simulator:8003
      ORCHESTRATOR_URL: http://orchestrator:8002
      GATEWAY_URL: http://gateway:8001
    ports:
      - "8004:8004"
    depends_on:
      simulator:
        condition: service_healthy
      orchestrator:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8004/healthz')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Gateway (API + React SPA) ─────────────────────────────────────────────────
  gateway:
    build:
      context: .
      dockerfile: docker/Dockerfile.gateway
    environment:
      <<: *env-common
      ORCHESTRATOR_URL: http://orchestrator:8002
      MCP_TOOLS_URL: http://mcp-tools:8004
      # OpenClaw webhook wake-up (ADR-011). The OpenClaw gateway runs on the
      # host, so from this container it is host.docker.internal:18789.
      OPENCLAW_HOOK_URL: ${OPENCLAW_HOOK_URL:-}
      OPENCLAW_HOOK_TOKEN: ${OPENCLAW_HOOK_TOKEN:-}
      # Embedded operator terminal (ADR-012). The terminal daemon runs on the
      # host (`make terminal`); from this container it is
      # ws://host.docker.internal:8005/ws. Off unless URL + token are set.
      TERMINAL_WS_URL: ${TERMINAL_WS_URL:-}
      TERMINAL_TOKEN: ${TERMINAL_TOKEN:-}
      TERMINAL_ENABLED: ${TERMINAL_ENABLED:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8001:8001"
    depends_on:
      orchestrator:
        condition: service_healthy
      mcp-tools:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/healthz')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # The agent runtime is real NemoClaw/OpenClaw, onboarded as a host process
  # via deploy/scripts/onboard-openclaw.sh (ADR-011). It reaches mcp-tools and
  # gateway through the ports published above.
