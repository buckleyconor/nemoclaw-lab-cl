# NemoClaw agent configuration — wired up in M6.
# NemoClaw v0.0.56 / OpenShell v0.0.44
# Install: curl -fsSL https://www.nvidia.com/nemoclaw.sh | NEMOCLAW_INSTALL_TAG=v0.0.56 bash

agent:
  name: infrastructure-sentinel
  version: "0.0.56"

llm:
  # Injected via env: VLLM_BASE_URL, VLLM_API_KEY, VLLM_MODEL
  base_url: "${VLLM_BASE_URL}"
  api_key: "${VLLM_API_KEY}"
  model: "${VLLM_MODEL}"

mcp_tools:
  # Injected via env: MCP_TOOLS_URL
  url: "${MCP_TOOLS_URL}"

gateway:
  # Injected via env: GATEWAY_URL
  url: "${GATEWAY_URL}"
