[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nemoclaw-lab"
version = "0.1.0"
description = "NemoClaw Infrastructure Sentinel — autonomous AIOps demo lab"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "mcp>=1.9.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.0.0",
    "httpx>=0.27.0",
    "pyyaml>=6.0.2",
    "redis>=5.0.0",
    "sse-starlette>=2.1.0",
    "python-multipart>=0.0.9",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.23.0",
    # Pinned exactly: an unbounded linter floats to whatever is newest at
    # CI time, so a release that adds a rule turns main red with no code
    # change. Bump deliberately, with the formatting sweep in the same commit.
    "ruff==0.15.20",
    "mypy>=1.13.0",
    "types-pyyaml>=6.0.12",
    "types-redis>=4.6.0",
    "respx>=0.21.0",
    "fakeredis>=2.26.0",
]
# fastembed/faiss-cpu require Linux (onnxruntime wheels); installed in Docker
# images and CI. Run `uv sync --group ml` on a Linux host or in a container.
ml = [
    "fastembed>=0.3.0",
    "faiss-cpu>=1.8.0",
]

[tool.hatch.build.targets.wheel]
packages = ["services", "libs"]

# ---------------------------------------------------------------------------
# Ruff — lint + format
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
# TCH/TC (type-checking-block imports) is deliberately NOT selected. Its whole
# value is deferring import cost and breaking cycles, neither of which applies
# to a long-running server whose imports are all loaded anyway — while Pydantic,
# FastAPI and the MCP server all resolve annotations at RUNTIME to build models,
# inject dependencies and generate tool schemas. Every fix the rule offers here
# is marked unsafe for exactly that reason: moving e.g. RemediationStep out of
# services/orchestrator/router.py's imports raises PydanticUndefinedAnnotation
# at import time.
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM"]
ignore = [
    "N999",   # module name may clash with class name in services
    "B008",   # FastAPI Depends() calls in function defaults
    # `class X(str, Enum)` is deliberate. These values are persisted (Redis /
    # SQLite) and cross the API boundary; StrEnum changes what str() and
    # f-strings produce, which is a real behaviour change for no functional
    # gain. Revisit only with serialization coverage in place.
    "UP042",
]

[tool.ruff.lint.isort]
known-first-party = ["libs", "services"]

[tool.ruff.format]
quote-style = "double"

# ---------------------------------------------------------------------------
# mypy
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
strict = false
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
exclude = ["ui/", "deploy/"]

[[tool.mypy.overrides]]
module = ["faiss.*", "fastembed.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
log_cli = true
log_cli_level = "INFO"
filterwarnings = [
    "ignore::starlette.testclient.StarletteDeprecationWarning",
]
