[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nemoclaw-lab"
version = "0.1.0"
description = "NemoClaw Infrastructure Sentinel — autonomous AIOps demo lab"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "mcp>=1.9.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.0.0",
    "httpx>=0.27.0",
    "pyyaml>=6.0.2",
    "redis>=5.0.0",
    "openai>=1.50.0",
    "sse-starlette>=2.1.0",
    "python-multipart>=0.0.9",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "types-pyyaml>=6.0.12",
    "types-redis>=4.6.0",
    "respx>=0.21.0",
]
# fastembed/faiss-cpu require Linux (onnxruntime wheels); installed in Docker
# images and CI. Run `uv sync --group ml` on a Linux host or in a container.
ml = [
    "fastembed>=0.3.0",
    "faiss-cpu>=1.8.0",
]

[tool.hatch.build.targets.wheel]
packages = ["services", "libs", "agent"]

# ---------------------------------------------------------------------------
# Ruff — lint + format
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "TCH"]
ignore = [
    "N999",   # module name may clash with class name in services
    "B008",   # FastAPI Depends() calls in function defaults
]

[tool.ruff.lint.isort]
known-first-party = ["libs", "services", "agent"]

[tool.ruff.format]
quote-style = "double"

# ---------------------------------------------------------------------------
# mypy
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
strict = false
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
exclude = ["ui/", "deploy/"]

[[tool.mypy.overrides]]
module = ["faiss.*", "fastembed.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
log_cli = true
log_cli_level = "INFO"
