# NemoClaw Helm chart — default values for MicroK8s / GB10 (arm64).
# Override for production: see deploy/helm/nemoclaw/values.prod.yaml (M9).

# ── Global ────────────────────────────────────────────────────────────────────
global:
  # Image registry prefix. MicroK8s built-in: localhost:32000
  # Docker Hub example: docker.io/yourusername
  registry: "localhost:32000"
  tag: "latest"
  pullPolicy: IfNotPresent
  packId: "datacenter-xe9680"

# ── Simulator ────────────────────────────────────────────────────────────────
simulator:
  image: "nemoclaw-backend"
  port: 8003
  command:
    - python
    - -m
    - uvicorn
    - services.simulator.main:app
    - --host
    - "0.0.0.0"
    - --port
    - "8003"
  replicas: 1
  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"

# ── Orchestrator ─────────────────────────────────────────────────────────────
orchestrator:
  image: "nemoclaw-backend"
  port: 8002
  command:
    - python
    - -m
    - uvicorn
    - services.orchestrator.main:app
    - --host
    - "0.0.0.0"
    - --port
    - "8002"
  replicas: 1
  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"

# ── MCP Tools ────────────────────────────────────────────────────────────────
mcpTools:
  image: "nemoclaw-backend"
  port: 8004
  # Expose ONLY the /mcp path through the gateway ingress host so the
  # out-of-cluster agent host (ADR-011) can reach MCP tools. /internal/*
  # stays cluster-only (no ingress path routes to it). Off by default —
  # the single-Docker-host dev deployment reaches mcp-tools directly.
  # NOTE: do NOT onboard the internal endpoint with `nemoclaw mcp add`;
  # its private-IP SSRF guard is hardcoded with no override (see
  # docs/TROUBLESHOOTING.md). The supported route is the OpenClaw plugin
  # config + agent-host proxy (deploy/proxy/, deploy/scripts/run-lab-proxy.sh).
  exposeMcp: false
  # Source CIDR admitted to port 8004 when exposeMcp is true. 0.0.0.0/0
  # matches the demo gateway's posture; narrow to the ingress-controller
  # pod CIDR or node CIDR in real deployments.
  mcpIngressCidr: "0.0.0.0/0"
  command:
    - python
    - -m
    - uvicorn
    - services.mcp_tools.main:app
    - --host
    - "0.0.0.0"
    - --port
    - "8004"
  replicas: 1
  resources:
    requests:
      cpu: "200m"
      memory: "512Mi"
    limits:
      cpu: "1000m"
      memory: "1536Mi"  # headroom for fastembed model + FAISS index

# ── Gateway ──────────────────────────────────────────────────────────────────
gateway:
  image: "nemoclaw-gateway"
  port: 8001
  command:
    - python
    - -m
    - uvicorn
    - services.gateway.main:app
    - --host
    - "0.0.0.0"
    - --port
    - "8001"
  replicas: 1
  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"

# ── Ingress (gateway only) ────────────────────────────────────────────────────
ingress:
  enabled: true
  # MicroK8s: `microk8s enable ingress` registers IngressClass "public" (not
  # "nginx") — verify with `kubectl get ingressclass` before deploying; an
  # Ingress with an unmatched class is silently never served.
  className: "public"
  # Set to the hostname you point at the MicroK8s node IP (or /etc/hosts entry).
  host: "nemoclaw.lab"
  # TLS disabled by default; enable in values.prod.yaml.
  tls: []
  # SSE (/api/events) + terminal WebSocket (/api/terminal/ws) are long-lived —
  # nginx's 60s proxy-read-timeout would drop them and buffering would starve
  # SSE. Ignored by non-nginx controllers.
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-buffering: "off"

# ── Redis ─────────────────────────────────────────────────────────────────────
redis:
  # Full image ref. Override on air-gapped clusters that mirror docker.io
  # through an internal registry (e.g. registry.nemoclaw.lab/library/redis:7-alpine).
  image: "redis:7-alpine"

# ── OpenClaw wake hook (ADR-011) ─────────────────────────────────────────────
# The autonomous agent is a HOST process outside the cluster (ADR-011) — it is
# not deployed by this chart, and its LLM endpoint (vLLM) is configured at
# onboard time on the agent host, not here. The gateway can POST a best-effort
# wake-up webhook to the agent host when a fault is injected; leave url/token
# empty to disable (the agent then falls back to its cron poll, which is
# slower but functional).
openclawHook:
  url: ""            # e.g. http://agent-host.lab:18790
  token: ""          # bearer token; rendered into a Secret, never a ConfigMap
  # NetworkPolicy egress scope for the hook. Narrow this to the agent host's
  # /32 where possible.
  egressCidr: "0.0.0.0/0"
  egressPort: 18790

# ── Restricted operator terminal (ADR-013, M9) ──────────────────────────────
# Each tenant gets its own dedicated terminal-daemon process on the external
# agent host (deploy/scripts/run-terminal-tenant.sh), running
# TERMINAL_MODE=restricted — a locked-down menu (SOUL.md/AGENTS.md/skills
# edit-and-push only, services/terminal/console.py), never a full shell.
# Empty url/token = disabled, same fail-safe posture as openclawHook.
terminal:
  wsUrl: ""          # e.g. ws://agent-host.lab:8006/ws (this tenant's port)
  token: ""          # bearer token; rendered into a Secret, never a ConfigMap
  egressCidr: "0.0.0.0/0"
  egressPort: 8006

# ── ServiceAccount (minimal RBAC — no K8s API access needed) ────────────────
serviceAccount:
  create: true
  name: ""
  annotations: {}
