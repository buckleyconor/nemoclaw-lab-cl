{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "nemoclaw.fullname" . }}-gateway
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "nemoclaw.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
  {{- with .Values.ingress.annotations }}
  # Long-lived connections are load-bearing here: the dashboard runs on SSE
  # (/api/events) and the embedded terminal on a WebSocket (/api/terminal/ws).
  # nginx's defaults (60s proxy-read-timeout, response buffering) silently
  # kill/starve both — the values files carry the required overrides.
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  {{- with .Values.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          {{- if .Values.mcpTools.exposeMcp }}
          # /mcp only — the out-of-cluster agent host (ADR-011) reaches MCP
          # tools through this path; mcp-tools' /internal/* surface stays
          # cluster-only because no other path is routed to it. Must precede
          # the catch-all / so nginx longest-prefix matching picks it. The
          # SSE annotations above (buffering off, 3600s timeouts) also cover
          # MCP Streamable HTTP's long-lived responses.
          - path: /mcp
            pathType: Prefix
            backend:
              service:
                name: {{ include "nemoclaw.fullname" . }}-mcp-tools
                port:
                  name: http
          {{- end }}
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "nemoclaw.fullname" . }}-gateway
                port:
                  name: http
{{- end }}
