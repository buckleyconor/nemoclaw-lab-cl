---
# Per-namespace resource cap — sized for one full NemoClaw stack on Charmed K8s.
# Scaled down slightly so 30 namespaces fit on a 4-node RTX PRO 6000 cluster.
apiVersion: v1
kind: ResourceQuota
metadata:
  name: {{ include "nemoclaw.fullname" . }}-quota
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "nemoclaw.labels" . | nindent 4 }}
spec:
  hard:
    requests.cpu: "4"
    requests.memory: 6Gi
    limits.cpu: "8"
    limits.memory: 12Gi
    pods: "20"
    services: "10"
    persistentvolumeclaims: "0"
---
# Default container resource envelope — prevents OOM from containers without explicit limits.
apiVersion: v1
kind: LimitRange
metadata:
  name: {{ include "nemoclaw.fullname" . }}-limits
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "nemoclaw.labels" . | nindent 4 }}
spec:
  limits:
    - type: Container
      default:
        cpu: 500m
        memory: 512Mi
      defaultRequest:
        cpu: 100m
        memory: 128Mi
      max:
        cpu: "4"
        memory: 8Gi
