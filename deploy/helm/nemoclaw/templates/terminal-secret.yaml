{{- /*
Restricted operator-terminal credentials (ADR-013, M9). Rendered only when
both wsUrl and token are set; the gateway's fail-safe default is off
otherwise (services/gateway/terminal.py), same posture as the OpenClaw wake
hook secret. wsUrl points at this tenant's dedicated terminal daemon on the
external agent host (deploy/scripts/run-terminal-tenant.sh), running
TERMINAL_MODE=restricted — never the unrestricted dev shell.
*/ -}}
{{- if and .Values.terminal.wsUrl .Values.terminal.token }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "nemoclaw.fullname" . }}-terminal
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "nemoclaw.labels" . | nindent 4 }}
type: Opaque
stringData:
  TERMINAL_WS_URL: {{ .Values.terminal.wsUrl | quote }}
  TERMINAL_TOKEN: {{ .Values.terminal.token | quote }}
  TERMINAL_ENABLED: "1"
{{- end }}
