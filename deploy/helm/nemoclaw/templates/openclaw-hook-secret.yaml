{{- /*
Wake-hook credentials for the out-of-cluster OpenClaw agent host (ADR-011).
Rendered only when both url and token are set; the gateway is fail-safe off
without them (the agent falls back to its cron poll).
*/ -}}
{{- if and .Values.openclawHook.url .Values.openclawHook.token }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "nemoclaw.fullname" . }}-openclaw-hook
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "nemoclaw.labels" . | nindent 4 }}
type: Opaque
stringData:
  OPENCLAW_HOOK_URL: {{ .Values.openclawHook.url | quote }}
  OPENCLAW_HOOK_TOKEN: {{ .Values.openclawHook.token | quote }}
{{- end }}
