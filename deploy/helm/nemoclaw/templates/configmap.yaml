apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "nemoclaw.fullname" . }}-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "nemoclaw.labels" . | nindent 4 }}
data:
  PACK_ID: {{ .Values.global.packId | quote }}
  SIMULATOR_URL: {{ printf "http://%s-simulator:%d" (include "nemoclaw.fullname" .) (.Values.simulator.port | int) | quote }}
  ORCHESTRATOR_URL: {{ printf "http://%s-orchestrator:%d" (include "nemoclaw.fullname" .) (.Values.orchestrator.port | int) | quote }}
  MCP_TOOLS_URL: {{ printf "http://%s-mcp-tools:%d" (include "nemoclaw.fullname" .) (.Values.mcpTools.port | int) | quote }}
  GATEWAY_URL: {{ printf "http://%s-gateway:%d" (include "nemoclaw.fullname" .) (.Values.gateway.port | int) | quote }}
  AGENT_POLL_INTERVAL_SECONDS: {{ .Values.agent.pollIntervalSeconds | quote }}
  AGENT_APPROVAL_TIMEOUT_SECONDS: {{ .Values.agent.approvalTimeoutSeconds | quote }}
  REDIS_URL: {{ printf "redis://%s-redis:6379" (include "nemoclaw.fullname" .) | quote }}
  REDIS_KEY_PREFIX: {{ .Release.Name | quote }}
